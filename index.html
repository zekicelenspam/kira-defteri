<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f4">
<meta name="description" content="Kiracı ve ev sahipleri için kira takibi, yenileme hesabı, ilan, belge ve görüşme randevusu.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kira Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kira Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Düzen: tek sütun, büyük dokunma alanları; yaşlı kullanıcılar için 18px taban yazı, en az 48px düğme */
:root{
  --bg:#f4f7f4;--kart:#fff;--yazi:#17241d;--yazi2:#2e3d35;--soluk:#4a5951;--cizgi:#d6e0d9;
  --yesil:#2b7553;--yesilA:#e4f1e9;--yesilK:#1c4f38;
  --kirmizi:#a8362a;--kirmiziA:#fbebe8;--sari:#7a5600;--sariA:#fff4d6;
  --mavi:#2a5873;--maviA:#eaf2f7;--golge:rgba(20,40,30,.14);--r:16px;
  --gutL:max(16px, env(safe-area-inset-left, 0px));--gutR:max(16px, env(safe-area-inset-right, 0px));
  --yazitipi:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yazi);font:18px/1.5 var(--yazitipi);font-variant-numeric:tabular-nums;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
a{color:var(--yesilK)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--yesil);outline-offset:2px}

/* üst çubuk */
.ust{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:var(--gutL);padding-right:var(--gutR);background:var(--bg);border-bottom:1px solid var(--cizgi)}
.marka{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--yesilK);text-decoration:none;font-size:19px}
.marka svg{flex:0 0 30px;width:30px;height:30px}
.bildirimBtn{position:relative;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);text-decoration:none;font-size:16px;font-weight:600}
.bildirimBtn em{font-style:normal;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--kirmizi);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}

main{max-width:640px;margin:0 auto;padding-block:8px 16px;padding-left:var(--gutL);padding-right:var(--gutR)}
.baslik{font-size:26px;line-height:1.25;margin:16px 0 6px;text-wrap:balance}
.baslikSatir{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.kart{display:block;background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px;margin:14px 0;color:inherit;text-decoration:none}
.kartUst{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kartBaslik{font-size:20px;line-height:1.3}
.soluk{color:var(--soluk)}
.kucukYazi{font-size:15px}
.vurgu{color:var(--yesilK)}
.geri{display:inline-flex;align-items:center;min-height:48px;margin-top:6px;padding:0 4px;text-decoration:none;font-weight:600;font-size:18px}
.ipucu{display:flex;gap:10px;align-items:flex-start;background:var(--maviA);color:var(--mavi);border-radius:12px;padding:12px 14px;margin:10px 0 4px;font-size:16px;line-height:1.45}
.ipucu svg{flex:0 0 22px;margin-top:1px}

/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--yesil);background:var(--yesil);color:#fff;font-size:17px;font-weight:600;text-decoration:none;cursor:pointer;text-align:center;line-height:1.2}
.btn:disabled{opacity:.45;cursor:default}
.btn.ikincil{background:var(--kart);color:var(--yesilK);border-color:var(--cizgi)}
.btn.tehlike{background:var(--kart);color:var(--kirmizi);border-color:#e7bdb5}
.btn.kucuk{min-height:48px;padding:0 14px;font-size:16px}
.btn.tam{width:100%;margin-top:14px}
.buyukBtn{min-height:58px;font-size:18px}
.btnlar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btnlar .btn{flex:1 1 auto}
.ikonBtn{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 10px;border-radius:12px;color:var(--yesilK);font-size:16px;font-weight:600;text-decoration:none;border:1px solid var(--cizgi)}
.tehlikeBolum{margin:28px 0 8px;padding:16px;border:2px dashed #e7bdb5;border-radius:var(--r);background:var(--kirmiziA)}
.tehlikeBolum>b{display:block;color:var(--kirmizi);font-size:16px}
.tehlikeBolum p{margin:4px 0 0;font-size:15px;color:var(--yazi2)}

/* form */
label.alan,div.alan{display:block;margin:14px 0;font-size:17px;font-weight:600;color:var(--yazi2)}
.etiket{display:block}
input,select,textarea{display:block;width:100%;margin-top:6px;font-size:18px;font-weight:400;color:var(--yazi);background:var(--kart);border:2px solid var(--cizgi);border-radius:12px;padding:12px 14px;min-height:54px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--yesilA);border-color:var(--yesil)}
input[type=checkbox]{display:inline-block;flex:0 0 28px;width:28px;height:28px;min-height:0;margin:0;accent-color:var(--yesil)}
.secenek{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;font-size:17px;font-weight:400;color:var(--yazi);cursor:pointer}
.onayKutusu{display:flex;gap:14px;align-items:flex-start;padding:16px;border:2px solid var(--cizgi);border-radius:14px;background:var(--kart);font-size:17px;cursor:pointer}
.onayKutusu input{margin-top:2px}
.ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:380px){.ikili.dar{grid-template-columns:1fr}}
.combo{position:relative;margin-top:6px}
.combo input{margin-top:0;padding-right:56px}
.comboBtn{position:absolute;top:2px;right:2px;width:52px;height:50px;border:0;background:transparent;color:var(--yazi2);font-size:20px;cursor:pointer;border-radius:0 10px 10px 0}
.comboListe{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;box-shadow:0 10px 28px var(--golge);max-height:280px;overflow:auto;padding:4px}
.comboListe button{display:block;width:100%;text-align:left;border:0;background:transparent;min-height:50px;padding:0 14px;border-radius:10px;font-size:18px;color:var(--yazi);cursor:pointer}
.comboListe button:hover,.comboListe button:focus-visible{background:var(--yesilA)}
.secilenTarih{margin:6px 0 8px;font-weight:400;font-size:17px;color:var(--yazi)}

/* sözleşme kartı */
.rolSerit{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--yesilA);color:var(--yesilK);font-size:16px}
.rolSerit b{font-weight:700}
.ozet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.ozet small,.yeniKira small{display:block;color:var(--soluk);font-size:15px}
.ozet b,.yeniKira b{font-size:21px}
.yeniKira{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--yesilA);border-radius:12px;padding:12px 14px;margin-top:14px}
.yeniKira p{grid-column:1/-1;margin:0}
.yeniKira.tahmini{background:var(--sariA)}
.tahminNot{grid-column:1/-1;margin:0;font-size:15px;line-height:1.45;color:var(--sari)}
.geriSayim{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:16px;color:var(--yazi2);white-space:nowrap}
.ilerleme{flex:1;height:8px;background:var(--cizgi);border-radius:9px;overflow:hidden}
.ilerleme>i{display:block;height:100%;background:var(--yesil);border-radius:9px}
.uyari{background:var(--sariA);border-color:#ecd38c}
.uyariUst{font-size:15px;font-weight:700;color:var(--sari);margin-bottom:4px}
.bilgiNot{background:var(--maviA);border-color:#cfdfe9}
.bilgiNot .uyariUst{color:var(--mavi)}
.durum{margin:8px 0 0;padding:10px 12px;border-radius:12px;font-size:16px}
.durum.kirmizi{background:var(--kirmiziA);color:var(--kirmizi)}
.durum.yesil{background:var(--yesilA);color:var(--yesilK)}
.durum.sari{background:var(--sariA);color:var(--sari)}
.cip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:15px;font-weight:600;background:var(--yesilA);color:var(--yesilK);white-space:nowrap}
.cip.kirmizi{background:var(--kirmiziA);color:var(--kirmizi)}
.cip.sari{background:var(--sariA);color:var(--sari)}
.cip.gri{background:#e9eeea;color:var(--yazi2)}
.cipler{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hizli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mini{margin:14px 0 0}
.mini b{display:block;font-size:30px;color:var(--yesilK)}
.mini span{font-size:16px;color:var(--yazi2)}
.bos{text-align:center;color:var(--yazi2);padding:28px 16px}
.yasal{font-size:15px;color:var(--soluk);text-align:center;margin:32px 0 8px}

/* ödemeler */
.yilSec{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.yilSec button{flex:0 0 auto;border:2px solid var(--cizgi);background:var(--kart);border-radius:999px;padding:0 18px;font-size:17px;cursor:pointer;min-height:48px;color:var(--yazi)}
.ay{background:var(--kart);border:2px solid var(--cizgi);border-radius:14px;padding:12px 14px;margin:10px 0}
.ay.odendi{border-color:#a9d3bb}
.ay.pasif{color:var(--soluk);font-size:16px;padding:10px 14px;border-width:1px}
.ayUst{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ayUst b{font-size:19px}
.ay details{margin-top:8px}
.ay summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--yesilK);font-size:16px;font-weight:600}
.ay label.alan{margin:8px 0 0}
.ozetTablo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.ozetTablo b{display:block;font-size:20px}
.ozetTablo small{color:var(--soluk);font-size:14px}

/* ilan */
.ilanKart{display:flex;gap:14px;padding:12px}
.ilanKart img,.fotoYok{flex:0 0 112px;width:112px;height:112px;object-fit:cover;border-radius:12px;background:var(--cizgi)}
.fotoYok{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--soluk);text-align:center}
.ilanBilgi{min-width:0}
.ilanBilgi b{display:block;font-size:19px;line-height:1.3}
.fiyat{font-weight:700;color:var(--yesilK);margin-top:4px;font-size:20px}
.fiyat small{font-weight:400;color:var(--soluk);font-size:16px}
.fiyat.buyuk{font-size:26px}
.galeri{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:12px;padding-bottom:6px}
.galeri img{flex:0 0 88%;height:240px;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:var(--cizgi);cursor:zoom-in;max-width:100%}
.ozellik{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ozellik small{display:block;color:var(--soluk);font-size:15px}
.aciklama{white-space:pre-wrap;margin:14px 0 0}
.liste{margin:8px 0 0;padding-left:22px}
.liste li{margin:4px 0}
.kucukler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kucukler div{position:relative}
.kucukler img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--cizgi);max-width:100%}
.kucukler button{position:absolute;top:6px;right:6px;min-height:36px;padding:0 10px;border-radius:18px;border:0;background:rgba(15,25,20,.75);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

/* takvim */
.takvim{border:2px solid var(--cizgi);border-radius:16px;padding:10px;background:var(--kart)}
.yilSatir{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--cizgi);font-size:17px}
.yilSatir button{min-height:44px;padding:0 12px;border:1px solid var(--cizgi);background:var(--kart);border-radius:12px;font-size:16px;cursor:pointer;color:var(--yazi)}
.takvimUst{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.takvimUst b{font-size:20px}
.takvimUst button{width:52px;height:52px;border:1px solid var(--cizgi);background:var(--kart);border-radius:14px;font-size:26px;line-height:1;cursor:pointer;color:var(--yazi)}
.takvimUst button:disabled,.yilSatir button:disabled{opacity:.3;cursor:default}
.takvimIzgara{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.takvimIzgara .hg{font-size:14px;color:var(--soluk);padding:4px 0;font-weight:600}
.tg{position:relative;min-height:48px;border:2px solid transparent;background:var(--kart);border-radius:12px;font-size:19px;font-weight:600;color:var(--yazi);cursor:pointer;padding:0}
.tg:disabled{color:#b3bdb7;font-weight:400;cursor:default}
.tg.bugun{border-color:var(--yesil)}
.tg.isaret::after{content:"";position:absolute;bottom:4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:4px;background:var(--yesil)}
.tg.secili.isaret::after{background:#fff}
.secili{background:var(--yesil)!important;border-color:var(--yesil)!important;color:#fff!important}
.adim{display:flex;align-items:center;gap:12px;margin:24px 0 10px;font-size:19px}
.adim>b,.adimMetin{flex:1;min-width:0}
.adimMetin small{display:block;font-size:15px;font-weight:400;color:var(--soluk)}
.adimNo{flex:0 0 34px;height:34px;border-radius:17px;background:var(--yesil);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.hizliSec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.hizliSec .btn{flex-direction:column;gap:0;padding:6px 4px;min-height:62px;font-size:16px}
.hizliSec small{font-weight:400;font-size:13px;color:var(--soluk)}
.hizliSec .btn.secili small{color:#fff}
.ozetGun{margin-top:12px;padding-top:12px;border-top:1px solid rgba(28,79,56,.18)}
.ozetGunUst{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cikarBtn{min-height:44px;padding:0 12px;border:1px solid #e7bdb5;background:var(--kart);color:var(--kirmizi);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.secimCipler{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.secimCip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 12px 0 14px;border:2px solid var(--yesil);background:var(--kart);color:var(--yesilK);border-radius:23px;font-size:17px;font-weight:600;cursor:pointer}
.secimCip span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;background:var(--yesilA);font-size:13px}
.saatIzgara,.segment{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.saatBuyuk,.segment button{min-height:56px;border:2px solid var(--cizgi);background:var(--kart);border-radius:14px;font-size:19px;font-weight:600;color:var(--yazi);cursor:pointer}
.saatBuyuk:disabled{opacity:.35;cursor:default}
.ozetKutu{margin-top:16px;padding:14px;border-radius:14px;background:var(--yesilA);color:var(--yesilK);font-size:17px;line-height:1.5}
.ozetKutu p{margin:4px 0 0}
.gunGrup{margin-top:14px}
.gunBaslik{font-size:16px;font-weight:700;color:var(--yazi2);margin-bottom:8px}
.saatler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.saat{border:2px solid var(--cizgi);background:var(--kart);border-radius:12px;min-height:50px;font-size:17px;cursor:pointer;color:var(--yazi);display:flex;align-items:center;justify-content:center;text-decoration:none}
.saat.dolu{background:var(--yesilA);border-color:#a9d3bb;color:var(--yesilK);font-weight:700}
.randevu{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--cizgi)}
.randevu:first-of-type{border-top:0}
.randevu .saatKutu{flex:0 0 64px;text-align:center;font-weight:700;font-size:20px;color:var(--yesilK)}

/* başvuru adımları */
.adimBar{margin-top:8px}
.adimBilgi{font-size:16px;font-weight:700;color:var(--yesilK)}
.adimNokta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.adimNokta i{height:8px;border-radius:4px;background:var(--cizgi)}
.adimNokta i.tamam{background:var(--yesil)}
.adimNav{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;margin-top:20px;padding:10px 0;background:var(--bg)}
.adimNav .btn{flex:1}
.belgeKutu{border:2px solid var(--cizgi);border-radius:16px;padding:16px;margin:14px 0;background:var(--kart)}
.belgeKutu.tamam{border-color:#a9d3bb}
.belgeKutuUst{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.belgeKutuUst b{font-size:19px;line-height:1.3}
.belgeOnizleme{display:flex;gap:12px;align-items:center;margin-top:12px}
.belgeOnizleme img,.belgeOnizleme .pdf{flex:0 0 72px;width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--kirmiziA);color:var(--kirmizi);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.belgeOnizleme span{min-width:0;overflow-wrap:anywhere;font-size:15px;color:var(--yazi2)}
.dosyaBtn{position:relative;overflow:hidden}
.ozetSatir{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--cizgi)}
.ozetSatir:first-child{border-top:0;padding-top:0}
.ozetSatir div{min-width:0}
.ozetSatir small{display:block;color:var(--soluk);font-size:15px}
.basari{text-align:center;padding:12px 0 4px}
.basari .tik{width:96px;height:96px;margin:8px auto 4px;border-radius:48px;background:var(--yesil);color:#fff;display:flex;align-items:center;justify-content:center}
.siradaki{margin:8px 0 0;padding-left:24px}
.siradaki li{margin:8px 0}

/* belgeler (görüntüleme) */
.belgeler{display:grid;gap:10px;margin-top:10px}
.belge{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--cizgi);background:var(--kart);border-radius:14px;padding:10px;cursor:pointer;color:var(--yazi);font-size:17px}
.belge img,.belge .pdf{flex:0 0 56px;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--kirmiziA);color:var(--kirmizi);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.belge span{min-width:0}
.belge small{display:block;color:var(--soluk);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bildirim{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--kart);border:2px solid var(--cizgi);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;color:var(--yazi);font-size:17px}
.bildirim.yeni{border-color:#a9d3bb;background:#f6fbf8}

<script>
'use strict';
/* =========================================================
   KİRA DEFTERİ
   - Ana veri: localStorage["kiraDefteri.v1"]  (tek JSON nesnesi: S)
   - Dosyalar (fotoğraf, belge): IndexedDB "kiraDefteriDosya"
   - Oranlar: oranlar.json (yoksa aşağıdaki gömülü değerler)
   ========================================================= */

/* Claude içinde mi (artifact), yoksa kendi sitesinde mi (GitHub Pages) çalışıyor? */
const CLAUDE_ICINDE = !!(window.claude && window.claude.use);
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const YUKLU = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const ORANLAR_VARSAYILAN = { "2026-10": 31.49, "2026-09": 31.79 };
const DEPO_ANAHTARI = 'kiraDefteri.v1';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

const BELGE_TURLERI = {
  kimlik: 'Kimlik (ön ve arka)',
  findeks: 'Findeks risk raporu',
  adli: 'Adli sicil kaydı',
  gelir: 'Gelir belgesi / maaş bordrosu',
  ikametgah: 'Yerleşim yeri (ikametgâh) belgesi',
  kefil: 'Kefil bilgileri',
  ogrenci: 'Öğrenci belgesi'
};
const BELGE_IPUCU = {
  kimlik: 'Kimliğinin ön ve arka yüzü. İkisi tek fotoğrafta yan yana olabilir.',
  findeks: 'findeks.com sitesinden veya bankanın uygulamasından PDF olarak alınır.',
  adli: "e-Devlet'te \"Adli Sicil Kaydı Sorgulama\" ile barkodlu PDF olarak alınır.",
  gelir: 'Son aya ait maaş bordrosu veya gelir belgesi.',
  ikametgah: "e-Devlet'te \"Yerleşim Yeri ve Diğer Adres Belgesi Sorgulama\" ile alınır.",
  kefil: 'Kefilin adı, telefonu ve kimlik bilgisi; fotoğraf ya da PDF.',
  ogrenci: "e-Devlet'ten veya okulundan alınan öğrenci belgesi."
};
const ANAHTAR = {
  kapida: 'Ev sahibi kapıda karşılayacak',
  kapici: 'Kapıcıdan / komşudan alınacak',
  kutu: 'Anahtar kutusu (şifreli)',
  yonetim: 'Site yönetiminden alınacak',
  emlak: 'Emlak ofisinden alınacak',
  diger: 'Diğer'
};
const DURUMLAR = {
  beklemede: ['Bekliyor', 'sari'],
  inceleniyor: ['İnceleniyor', 'sari'],
  onaylandi: ['Onaylandı', ''],
  reddedildi: ['Reddedildi', 'kirmizi'],
  geriCekildi: ['Geri çekildi', 'gri']
};
const ODA_SECENEKLERI = ['Stüdyo (1+0)', '1+1', '2+1', '2+2', '3+1', '3+2', '4+1', '4+2', '5+1', '5+2', '6+1', 'Dubleks', 'Tripleks'];

/* ---------- Durum (state) ---------- */
function bosDurum() {
  return {
    surum: 1,
    rol: null,                 // 'kiraci' | 'evsahibi'
    tanitim: false,            // ilk açılış tanıtımı görüldü mü
    profil: { ad: '', telefon: '' },
    oranlar: {},               // "YYYY-MM": yüzde
    sozlesmeler: [],           // {id, rol, ad, baslangic, kira, karsiTaraf, telefon, istenenKira, uyari30, olusturma}
    odemeler: {},              // { [sozlesmeId]: { "YYYY-MM": {durum, tarih, tutar, not} } }
    ilanlar: [],               // {id, baslik, adres, kira, depozito, oda, m2, kat, aciklama, fotolar[], belgeler[], anahtar{yontem,aciklama}, durum, olusturma}
    slotlar: [],               // {id, ilanId, bas:"YYYY-MM-DDTHH:MM", sure, durum:'bos'|'dolu', basvuruId, hat24}
    basvurular: [],            // {id, ilanId, ad, telefon, mesaj, belgeler{tur:{id,ad,tur,boyut}}, slotId, durum, evSahibiNotu, olusturma}
    bildirimler: []            // {id, rol, metin, link, tarih, okundu}
  };
}
function yukle() {
  try {
    const v = JSON.parse(localStorage.getItem(DEPO_ANAHTARI));
    if (v && typeof v === 'object') return Object.assign(bosDurum(), v);
  } catch (e) {}
  return bosDurum();
}
let S = yukle();
function kaydet() {
  try { localStorage.setItem(DEPO_ANAHTARI, JSON.stringify(S)); }
  catch (e) { toast('Kaydedilemedi: cihaz depolaması dolu olabilir.'); }
}

/* ---------- Dosya deposu (IndexedDB) ---------- */
const DB = {
  db: null,
  async ac() {
    if (this.db) return this.db;
    this.db = await new Promise((ok, no) => {
      const r = indexedDB.open('kiraDefteriDosya', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('dosyalar', { keyPath: 'id' });
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    });
    return this.db;
  },
  async islem(mod, fn) {
    const db = await this.ac();
    return new Promise((ok, no) => {
      const t = db.transaction('dosyalar', mod);
      const istek = fn(t.objectStore('dosyalar'));
      t.oncomplete = () => ok(istek ? istek.result : undefined);
      t.onerror = () => no(t.error);
      t.onabort = () => no(t.error);
    });
  },
  koy(k) { return this.islem('readwrite', s => s.put(k)); },
  al(id) { return this.islem('readonly', s => s.get(id)); },
  sil(id) { return this.islem('readwrite', s => s.delete(id)); },
  hepsi() { return this.islem('readonly', s => s.getAll()); }
};
const URLLER = {};
async function dosyaUrl(id) {
  if (URLLER[id]) return URLLER[id];
  const k = await DB.al(id).catch(() => null);
  if (!k) return null;
  return (URLLER[id] = URL.createObjectURL(k.blob));
}
async function resimKucult(file, max, kalite) {
  try {
    const bmp = await createImageBitmap(file);
    const o = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * o); c.height = Math.round(bmp.height * o);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', kalite));
    return b && b.size < file.size ? b : file;
  } catch (e) { return file; }
}
async function dosyaKaydet(file, maxPx) {
  let blob = file;
  if (file.type.startsWith('image/')) blob = await resimKucult(file, maxPx || 2000, 0.85);
  if (blob.size > 8 * 1024 * 1024) throw new Error(`"${file.name}" çok büyük. En fazla 8 MB olabilir.`);
  const k = { id: uid(), ad: file.name, tur: blob.type || file.type, boyut: blob.size, blob, olusturma: new Date().toISOString() };
  await DB.koy(k);
  return { id: k.id, ad: k.ad, tur: k.tur, boyut: k.boyut };
}
async function dosyaSil(id) { try { await DB.sil(id); } catch (e) {} if (URLLER[id]) { URL.revokeObjectURL(URLLER[id]); delete URLLER[id]; } }
function dosyalariBagla(kok) {
  (kok || document).querySelectorAll('img[data-dosya]').forEach(async img => {
    const u = await dosyaUrl(img.dataset.dosya);
    if (u) img.src = u;
  });
}
async function belgeAc(id, indirAdi) {
  const k = await DB.al(id).catch(() => null);
  const u = await dosyaUrl(id);
  if (!k || !u) return toast('Dosya bulunamadı.');
  const resim = (k.tur || '').startsWith('image/');
  $('#modalIcerik').innerHTML = `<div class="kartUst" style="margin-bottom:12px"><b style="min-width:0;overflow-wrap:anywhere">${esc(indirAdi || k.ad)}</b><button class="btn kucuk ikincil" onclick="modalKapat()">Kapat</button></div>`
    + (resim ? `<img src="${u}" alt="${esc(k.ad)}">` : `<iframe src="${u}" title="${esc(k.ad)}"></iframe><p class="soluk kucukYazi" style="margin-top:8px">PDF burada görünmüyorsa cihazın PDF önizlemesini desteklemiyor olabilir.</p>`)
    + (indirAdi ? `<button class="btn tam" onclick="tekBelgeIndir('${id}','${esc(indirAdi).replace(/'/g, '&#39;')}')">${ik(IK.indir, 22)}Bu belgeyi indir / paylaş</button>` : '');
  $('#modal').hidden = false;
}

/* ---------- İndirme / paylaşma (downloads yeteneği) ---------- */
const UZANTI = { 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'application/pdf': 'pdf' };
const dosyaAdi = t => String(t).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
async function kaydetPaylas(filename, data) {
  if (!CLAUDE_ICINDE) return paylasimPenceresi(filename, data instanceof Blob ? data : new Blob([data]));
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (!dl) { toast('Bu görünümde dosya kaydedilemiyor. Sayfayı Claude uygulamasında aç.'); return false; }
  try { await dl.save({ filename, data }); toast('Dosya hazır'); return true; }
  catch (e) {
    const k = e && e.code;
    toast(k === 'declined' ? 'Kaydetme iptal edildi.' : k === 'rate_limited' ? 'Biraz bekleyip yeniden dene.' : k === 'too_large' ? 'Dosya çok büyük.' : 'Dosya kaydedilemedi.');
    return false;
  }
}
/* Kendi sitesinde: dosya hazır olunca paylaşım penceresi (dokunuşla açıldığı için telefon izin verir) */
const trAscii = t => String(t).replace(/[çÇğĞıİöÖşŞüÜ]/g, c => ({ ç: 'c', Ç: 'C', ğ: 'g', Ğ: 'G', ı: 'i', İ: 'I', ö: 'o', Ö: 'O', ş: 's', Ş: 'S', ü: 'u', Ü: 'U' }[c]));
function paylasimPenceresi(ad, blob) {
  ad = trAscii(ad);
  const tur = blob.type || (ad.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
  const dosya = new File([blob], ad, { type: tur });
  const paylasilir = !!(navigator.canShare && navigator.canShare({ files: [dosya] }));
  $('#modalIcerik').innerHTML = `<div style="text-align:center"><div class="tik" style="width:64px;height:64px;margin:4px auto 8px;border-radius:32px;background:var(--yesil);color:#fff;display:flex;align-items:center;justify-content:center">${ik(IK.tik, 36)}</div>
    <b style="font-size:20px">Dosya hazır</b><p class="soluk" style="margin:4px 0 0;overflow-wrap:anywhere">${esc(ad)} · ${boyutYaz(blob.size)}</p></div>
    ${paylasilir ? `<button class="btn tam buyukBtn" id="pPaylas">${ik(IK.paylas, 22)}Paylaş: WhatsApp, Mail, Yazdır…</button>` : ''}
    <button class="btn ${paylasilir ? 'ikincil' : ''} tam" id="pIndir">${ik(IK.indir, 22)}Telefona indir</button>
    <button class="btn ikincil tam" onclick="modalKapat()">Kapat</button>
    ${paylasilir ? '<p class="soluk kucukYazi" style="margin-top:10px">Yazdırmak için paylaş menüsünde "Yazdır"ı seç.</p>' : ''}`;
  $('#modal').hidden = false;
  if (paylasilir) $('#pPaylas').onclick = async () => {
    try { await navigator.share({ files: [dosya], title: ad }); modalKapat(); }
    catch (e) { if (!e || e.name !== 'AbortError') toast('Paylaşım açılamadı; "Telefona indir"i dene.'); }
  };
  $('#pIndir').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ad;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('İndiriliyor'); modalKapat();
  };
  return true;
}
async function tekBelgeIndir(id, ad) {
  const k = await DB.al(id).catch(() => null);
  if (!k) return toast('Dosya bulunamadı.');
  let blob = k.blob, uz = UZANTI[k.tur];
  if (!uz && (k.tur || '').startsWith('image/')) {   // ör. HEIC: JPEG'e çevir
    try { const bmp = await createImageBitmap(k.blob); const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height; c.getContext('2d').drawImage(bmp, 0, 0); blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)); uz = 'jpg'; } catch (e) {}
  }
  if (!uz) return toast('Bu dosya biçimi indirilemiyor.');
  kaydetPaylas(`${dosyaAdi(ad)}.${uz}`, blob);
}
let PDFLIB_SOZ = null;
function pdfLibYukle() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  const kaynaklar = ['https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'];
  const dene = n => new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = kaynaklar[n];
    sc.onload = () => (window.PDFLib ? ok(window.PDFLib) : no());
    sc.onerror = () => { sc.remove(); n + 1 < kaynaklar.length ? dene(n + 1).then(ok, no) : no(); };
    document.head.appendChild(sc);
  });
  return (PDFLIB_SOZ = PDFLIB_SOZ || dene(0).catch(() => { PDFLIB_SOZ = null; throw new Error('PDF aracı yüklenemedi. İnternet bağlantını kontrol edip yeniden dene.'); }));
}
const SAYFA = [1240, 1754];  // A4, 150 dpi
function sayfaTuvali() { const c = document.createElement('canvas'); c.width = SAYFA[0]; c.height = SAYFA[1]; const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.textBaseline = 'top'; return [c, x]; }
function satirlar(x, metin, X, Y, en, yuk) {
  const kelimeler = String(metin).split(/\s+/); let satir = '';
  for (const k of kelimeler) {
    const dene = satir ? satir + ' ' + k : k;
    if (x.measureText(dene).width > en && satir) { x.fillText(satir, X, Y); Y += yuk; satir = k; } else satir = dene;
  }
  if (satir) { x.fillText(satir, X, Y); Y += yuk; }
  return Y;
}
const yaziTipi = (k, kalin) => `${kalin ? 700 : 400} ${k}px ${getComputedStyle(document.body).fontFamily}`;
async function tuvalJpg(c) { const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88)); return new Uint8Array(await b.arrayBuffer()); }
async function tuvaliSayfaYap(doc, c) { const im = await doc.embedJpg(await tuvalJpg(c)); const pg = doc.addPage([595.28, 841.89]); pg.drawImage(im, { x: 0, y: 0, width: 595.28, height: 841.89 }); }
async function belgelerPdf(bid) {
  const b = S.basvurular.find(x => x.id === bid); if (!b) return;
  const i = S.ilanlar.find(x => x.id === b.ilanId), slot = b.slotId && S.slotlar.find(x => x.id === b.slotId);
  const btn = $('#pdfBtn'), eski = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'PDF hazırlanıyor…'; }
  try {
    const { PDFDocument } = await pdfLibYukle();
    const doc = await PDFDocument.create();
    doc.setTitle(`${b.ad} - başvuru belgeleri`); doc.setCreator('Kira Defteri');
    const liste = Object.entries(b.belgeler || {});
    // Kapak sayfası
    let [c, x] = sayfaTuvali(); const M = 110, EN = SAYFA[0] - 2 * M; let y = 120;
    x.fillStyle = '#2b7553'; x.fillRect(0, 0, SAYFA[0], 24);
    x.fillStyle = '#1c4f38'; x.font = yaziTipi(58, true); y = satirlar(x, 'Kiracı başvuru belgeleri', M, y, EN, 72) + 30;
    x.fillStyle = '#17241d';

function sayiAl(v) {

}

/* Tutar alanında yazarken binlik nokta: 25000 → 25.000 */
function tutarBicimle(v) {
  let t = String(v).replace(/[^\d,]/g, '');

  let tam = i < 0 ? t : t.slice(0, i), kes = i < 0 ? null : t.slice(i + 1).replace(/,/g, '').slice(0, 2);

}
document.addEventListener('input', e => {
  const el = e.target;

  const solRakam = el.value.slice(0, imlec).replace(/[^\d,]/g, '').length;
  const yeni = tutarBicimle(el.value);

  let n = 0, p = 0;

});

/* ---------- Yenileme hesabı ---------- */
function yildonumu(bas, n) {
  const b = tarihAl(bas);
  const d = new Date(b.getFullYear() + n, b.getMonth(), b.getDate());
  if (d.getMonth() !== b.getMonth()) d.setDate(0); // 29 Şubat → 28 Şubat
  return d;
}
function yenileme(s) {
  const t = bugun();
  let n = 1;
  while (yildonumu(s.baslangic, n) < t) n++;
  const tarih = yildonumu(s.baslangic, n);
  const ay = ayAnahtar(tarih);
  const ob = oranBul(ay);
  return {
    n,                                  // içinde bulunulan kira yılı (yenilemede n yıl dolar)
    tarih,
    kalan: gunFark(t, tarih),
    ay,
    oran: ob.oran,
    kaynakAy: ob.kaynakAy,              // oranın alındığı ay
    tahmini: ob.tahmini,                // yenileme ayının oranı yoksa son açıklanan oran kullanılır
    yeni: ob.oran != null ? Math.round(s.kira * (1 + ob.oran / 100) * 100) / 100 : null
  };
}
/* Yenileme ayının oranı yoksa, ondan önceki en son açıklanan oranla tahmini hesap */
function oranBul(ay) {
  const o = oranAl(ay);
  if (o != null) return { oran: o, kaynakAy: ay, tahmini: false };
  const onceki = Object.keys(S.oranlar).filter(k => k < ay && S.oranlar[k] != null).sort().pop();
  return onceki ? { oran: Number(S.oranlar[onceki]), kaynakAy: onceki, tahmini: true } : { oran: null, kaynakAy: null, tahmini: false };
}
const tahminEki = y => (y.tahmini ? ' (tahmini)' : '');
function tahminNotu(y) {
  return y.tahmini ? `${ayAdi(y.ay)} oranı henüz açıklanmadı. Hesap, açıklanan son oran olan ${ayAdi(y.kaynakAy)} oranıyla yapıldı. ${ayAdi(y.ay)} oranı açıklanınca kendiliğinden güncellenir.` : '';
}

/* ---------- Gömülü ay takvimi (açılır pencere değil) ---------- */
const HAFTA = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
function takvimCiz(o) {
  const { ay, secili = [], isaretli = new Set(), secilebilir = null, tikla, gezin, yilGezin = null, serbest = false, sinirAy = 6 } = o;
  const b = bugun(), ilkAy = new Date(b.getFullYear(), b.getMonth(), 1);
  const son = new Date(ilkAy.getFullYear(), ilkAy.getMonth() + sinirAy, 1);
  const y = ay.getFullYear(), m = ay.getMonth();
  const oncekiKapali = serbest ? y <= b.getFullYear() - 30 && m === 0 : ay <= ilkAy;
  const sonrakiKapali = serbest ? new Date(y, m + 1, 1) > new Date(b.getFullYear() + 1, 11, 1) : new Date(y, m + 1, 1) >= son;
  const bosluk = (new Date(y, m, 1).getDay() + 6) % 7, gunSay = new Date(y, m + 1, 0).getDate();
  let h = '';
  for (let k = 0; k < bosluk; k++) h += '<span></span>';
  for (let g = 1; g <= gunSay; g++) {
    const d = new Date(y, m, g), iso = isoGun(d);
    const kapali = (!serbest && d < b) || (secilebilir && !secilebilir.has(iso));
    const sec = secili.includes(iso);
    const sinif = ['tg', sec ? 'secili' : '', isaretli.has(iso) ? 'isaret' : '', +d === +b ? 'bugun' : ''].filter(Boolean).join(' ');
    h += `<button type="button" class="${sinif}" ${kapali ? 'disabled' : ''} aria-pressed="${sec}" aria-label="${gunBaslik(iso)}" onclick="${tikla}('${iso}')">${g}</button>`;
  }
  const yilSatir = yilGezin ? `<div class="yilSatir"><button type="button" onclick="${yilGezin}(-1)" ${y <= b.getFullYear() - 30 ? 'disabled' : ''}>‹ ${y - 1}</button><span>Yıl: <b>${y}</b></span><button type="button" onclick="${yilGezin}(1)" ${y >= b.getFullYear() + 1 ? 'disabled' : ''}>${y + 1} ›</button></div>` : '';
  return `<div class="takvim">${yilSatir}<div class="takvimUst">
      <button type="button" onclick="${gezin}(-1)" aria-label="Önceki ay" ${oncekiKapali ? 'disabled' : ''}>‹</button>
      <b>${AYLAR[m]} ${y}</b>
      <button type="button" onclick="${gezin}(1)" aria-label="Sonraki ay" ${sonrakiKapali ? 'disabled' : ''}>›</button></div>
    <div class="takvimIzgara">${HAFTA.map(x => `<span class="hg">${x}</span>`).join('')}${h}</div></div>`;
}

function sozlesmeKarti(s, y) {

}

  const kayit = S.odemeler[id] || {};

    ${satirlar}`;

function odemeKaydi(id, k) { S.odemeler[id] = S.odemeler[id] || {}; return (S.odemeler[id][k] = S.odemeler[id][k] || {}); }

/* ---------- İlanlar ---------- */
function gelecekSlotlar(ilanId) {

function gunlereAyir(arr) { const g = {}; arr.forEach(x => (g[x.bas.slice(0, 10)] = g[x.bas.slice(0, 10)] || []).push(x)); return g; }
function ekranIlanlar() {

/* Ev sahibi: görüşme saatleri (çoklu gün, büyük saat düğmeleri) */
let SF = { ilanId: null, gunler: [], ay: null, saatler: [], sure: 30 };
const SAATLER = ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00'];
const DILIMLER = [['Sabah', '09:00', '12:00'], ['Öğleden sonra', '12:00', '17:00'], ['Akşam', '17:00', '21:00']];
function sfHazirla(ilanId) {
  if (SF.ilanId === ilanId) return;
  const b = bugun();
  SF = { ilanId, gunler: [], ay: new Date(b.getFullYear(), b.getMonth(), 1), saatler: [], sure: 30, haric: [] };
}
/* Yalnızca bugün seçiliyse, geçmiş saatler kapanır */
const saatKapali = s => SF.gunler.length === 1 && SF.gunler[0] === isoGun(new Date()) && new Date(`${SF.gunler[0]}T${s}`).getTime() + 3600000 <= Date.now();
function sfGun(iso) { SF.gunler = SF.gunler.includes(iso) ? SF.gunler.filter(g => g !== iso) : [...SF.gunler, iso].sort(); SF.saatler = SF.saatler.filter(s => !saatKapali(s)); render(); }
function gunUyar() {
  const el = $('#sfTakvim'); if (!el) return;
  const sakin = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({ behavior: sakin ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('isikla'); void el.offsetWidth; el.classList.add('isikla');
  toast('Önce takvimden bir gün seç');
}
function sfGunTemizle() { SF.gunler = []; render(); }
function sfAy(d) { SF.ay = new Date(SF.ay.getFullYear(), SF.ay.getMonth() + d, 1); render(); }
const haricTemizle = saatler => { SF.haric = (SF.haric || []).filter(b => !saatler.includes(b.slice(11, 13) + ':00')); };
function sfSaat(s) { haricTemizle([s]); SF.saatler = SF.saatler.includes(s) ? SF.saatler.filter(x => x !== s) : [...SF.saatler, s]; render(); }
function sfDilim(a, b) {
  const grup = SAATLER.filter(s => s >= a && s < b && !saatKapali(s));
  const hepsi = grup.every(s => SF.saatler.includes(s));
  haricTemizle(grup);
  SF.saatler = hepsi ? SF.saatler.filter(s => !grup.includes(s)) : [...new Set([...SF.saatler, ...grup])];
  render();
}
function sfSure(d) { SF.sure = d; SF.haric = []; render(); }
/* Dilimin tüm saatleri seçiliyse dilim düğmesi de koyu yeşil olur */
const dilimSecili = (a, b) => { const grup = SAATLER.filter(s => s >= a && s < b && !saatKapali(s)); return grup.length > 0 && grup.every(s => SF.saatler.includes(s)); };
/* Özet kutusundan tek bir saati veya bütün bir günü çıkarma */
function sfCikar(bas) { SF.haric = [...(SF.haric || []), bas]; render(); }
function sfGunCikar(gun) { SF.gunler = SF.gunler.filter(g => g !== gun); render(); }
function sfSlotlar() {
  const simdi = new Date(), out = [];
  SF.gunler.forEach(gun => [...SF.saatler].sort().forEach(s => {
    const h = Number(s.slice(0, 2));
    for (let m = 0; m < 60; m += SF.sure) { const bas = `${gun}T${iki(h)}:${iki(m)}`; if (new Date(bas) > simdi && !(SF.haric || []).includes(bas)) out.push(bas); }
  }));
  return out;
}
function sfOzet() {
  if (!SF.gunler.length) return 'Önce takvimden bir veya birkaç gün seç.';
  if (!SF.saatler.length) return `<b>${SF.gunler.length} gün seçtin.</b><p>Şimdi saatleri seç.</p>`;
  const g = gunlereAyir(sfSlotlar().map(bas => ({ bas })));
  const satirlar = Object.entries(g).map(([d, arr]) => `<div class="ozetGun"><div class="ozetGunUst"><b>${gunBaslik(d)}</b><button type="button" class="cikarBtn" onclick="sfGunCikar('${d}')" aria-label="${gunBaslik(d)} gününü çıkar">Günü çıkar ✕</button></div>
    <div class="secimCipler">${arr.map(x => `<button type="button" class="secimCip" onclick="sfCikar('${x.bas}')" aria-label="${saat(x.bas)} saatini çıkar">${saat(x.bas)} <span aria-hidden="true">✕</span></button>`).join('')}</div></div>`).join('');
  return `<b>Toplam ${sfSlotlar().length} görüşme saati eklenecek</b><p class="kucukYazi" style="margin:2px 0 0">İstemediğin saatin üstüne dokunarak çıkarabilirsin.</p>${satirlar || '<p>Seçtiğin saatler geçmişte kalıyor ya da hepsini çıkardın.</p>'}`;
}
function slotEditor(i) {

  const gunVar = SF.gunler.length > 0;
  return `<div class="kart"><b class="kartBaslik">Görüşme saatleri</b>
    <p class="soluk" style="margin:4px 0 0">Kiracılar buradan eklediğin saatlerden birini seçer; sana bildirim gelir.</p>

    <div id="sfTakvim" class="${gunVar ? '' : 'baslaBurada'}">${gunVar ? '' : '<div class="baslaEtiket">Buradan başla: bir gün seç ↓</div>'}${takvimCiz({ ay: SF.ay, secili: SF.gunler, isaretli: new Set(Object.keys(g)), tikla: 'sfGun', gezin: 'sfAy' })}</div>
    <p class="soluk kucukYazi" style="margin:8px 0 0">Altında yeşil nokta olan günlere daha önce saat eklemişsin.</p>
    ${SF.gunler.length > 1 ? `<button type="button" class="btn ikincil kucuk" style="margin-top:8px" onclick="sfGunTemizle()">Gün seçimini temizle (${SF.gunler.length} gün)</button>` : ''}
    <div class="adim"><span class="adimNo">2</span><span class="adimMetin"><b>Saat seç</b><small>Birden fazla saat seçebilirsin</small></span></div>
    ${gunVar ? '' : '<p class="durum sari" style="margin:0 0 10px">↑ Saat seçmeden önce yukarıdaki takvimden bir gün seç.</p>'}
    <div class="hizliSec ${gunVar ? '' : 'beklemedeGrup'}">${DILIMLER.map(([ad, a, b]) => `<button type="button" class="btn ikincil ${dilimSecili(a, b) ? 'secili' : ''}" aria-pressed="${dilimSecili(a, b)}" onclick="${gunVar ? `sfDilim('${a}','${b}')` : 'gunUyar()'}">${ad}<small>${a}–${b}</small></button>`).join('')}</div>
    <div class="saatIzgara">${SAATLER.map(s => { const sec = SF.saatler.includes(s); return `<button type="button" class="saatBuyuk ${sec ? 'secili' : ''} ${gunVar ? '' : 'beklemede'}" aria-pressed="${sec}" onclick="${gunVar ? `sfSaat('${s}')` : 'gunUyar()'}" ${gunVar && saatKapali(s) ? 'disabled' : ''}>${s}</button>`; }).join('')}</div>
    <div class="adim"><span class="adimNo">3</span><b>Her görüşme ne kadar sürsün?</b></div>

    <div class="ozetKutu">${sfOzet()}</div>
    <button type="button" class="btn tam buyukBtn" onclick="slotEkle('${i.id}')" ${hazir ? '' : 'disabled'}>Bu saatleri ekle</button>
    <div class="adim"><b>Eklediğin saatler</b></div>
    ${Object.entries(g).map(([d, arr]) => `<div class="gunGrup"><div class="gunBaslik">${gunBaslik(d)}</div><div class="saatler">${arr.map(x => x.durum === 'bos'
      ? `<button class="saat" onclick="slotSil('${x.id}')" aria-label="${saat(x.bas)} saatini sil">${saat(x.bas)} ✕</button>`
      : `<a class="saat dolu" href="#/basvuru/${x.basvuruId}">${saat(x.bas)}</a>`).join('')}</div></div>`).join('') || '<p class="soluk">Henüz saat eklemedin.</p>'}
    ${mevcut.length ? '<p class="soluk kucukYazi">Boş bir saati silmek için üstündeki ✕ işaretine dokun. Yeşil saatler dolu; dokununca başvuruyu açar.</p>' : ''}</div>`;
}
function slotEkle(ilanId) {
  let n = 0;
  sfSlotlar().forEach(bas => {
    if (S.slotlar.some(x => x.ilanId === ilanId && x.bas === bas)) return;
    S.slotlar.push({ id: uid(), ilanId, bas, sure: SF.sure, durum: 'bos', basvuruId: null, hat24: false }); n++;
  });
  SF.saatler = []; SF.gunler = []; SF.haric = [];
  kaydet(); toast(n ? `${n} görüşme saati eklendi` : 'Bu saatler zaten ekliydi'); render();
}
function slotSil(id) { S.slotlar = S.slotlar.filter(x => !(x.id === id && x.durum === 'bos')); kaydet(); toast('Saat silindi'); render(); }

function ozellik(ad, v) { return `<div><small>${ad}</small><b>${v}</b></div>`; }
function ekranIlan(id) {
  const i = S.ilanlar.find(x => x.id === id); if (!i) return bulunamadi();

  if (i.fotolar && i.fotolar.length) h += `<div class="galeri">${i.fotolar.map(f => `<img data-dosya="${f}" alt="Ev fotoğrafı" onclick="belgeAc('${f}')">`).join('')}</div>`;

}
function ilanDurum(id) { const i = S.ilanlar.find(x => x.id === id); i.durum = i.durum === 'yayinda' ? 'kapali' : 'yayinda'; kaydet(); toast(i.durum === 'yayinda' ? 'İlan yayında' : 'İlan gizlendi'); render(); }
async function ilanSil(id) {
  if (!(await onayla('İlan; fotoğrafları, görüşme saatleri, başvuruları ve başvuru belgeleriyle birlikte silinsin mi?', 'Evet, ilanı sil'))) return;
  const i = S.ilanlar.find(x => x.id === id);
  for (const f of (i.fotolar || [])) await dosyaSil(f);
  for (const f of ((i.anahtar && i.anahtar.fotolar) || [])) await dosyaSil(f.id);
  for (const b of S.basvurular.filter(x => x.ilanId === id)) for (const d of Object.values(b.belgeler || {})) await dosyaSil(d.id);
  S.ilanlar = S.ilanlar.filter(x => x.id !== id);
  S.slotlar = S.slotlar.filter(x => x.ilanId !== id);
  S.basvurular = S.basvurular.filter(x => x.ilanId !== id);
  kaydet(); toast('İlan silindi'); git('#/ilanlar');
}

  b.durum = d; kaydet();
  bildir('kiraci', `${i ? i.baslik : 'İlan'} başvurunun durumu: ${DURUMLAR[d][0]}`, '#/basvuru/' + b.id);
  toast('Karar kaydedildi, kiracıya bildirim gitti'); render();
}
function basvuruNot(bid, v) { S.basvurular.find(x => x.id === bid).evSahibiNotu = v; kaydet(); toast('Not kaydedildi'); }
async function belgeleriSil(bid) {
  if (!(await onayla('Bu başvurunun belgeleri bu cihazdan kalıcı olarak silinsin mi?', 'Evet, belgeleri sil'))) return;
  const b = S.basvurular.find(x => x.id === bid);
  for (const d of Object.values(b.belgeler || {})) await dosyaSil(d.id);
  b.belgeler = {}; kaydet(); toast('Belgeler silindi'); render();
}
function durumCip(d) { const [ad, r] = DURUMLAR[d] || [d, 'gri']; return `<span class="cip ${r}">${ad}</span>`; }
function basvuruSatiri(b) {
  const i = S.ilanlar.find(x => x.id === b.ilanId), sl = b.slotId && S.slotlar.find(x => x.id === b.slotId);
  const ev = S.rol === 'evsahibi';
  return `<a class="kart" href="#/basvuru/${b.id}" style="margin:10px 0"><div class="kartUst"><div style="min-width:0"><b style="font-size:18px">${esc(ev ? b.ad : (i ? i.baslik : 'Silinmiş ilan'))}</b>
    <div class="soluk kucukYazi">${ev ? esc(i ? i.baslik : '') + '<br>' : ''}${sl ? 'Görüşme: ' + tarihSaat(sl.bas) : 'Görüşme saati yok'}</div></div>${durumCip(b.durum)}</div></a>`;
}
function ekranBasvurular() {
  const ev = S.rol === 'evsahibi';
  const list = [...S.basvurular].sort((a, b) => b.olusturma.localeCompare(a.olusturma));
  return `<h2 class="baslik">${ev ? 'Gelen başvurular' : 'Başvurularım'}</h2>
    ${ipucu(ev ? 'Bir başvuruya dokun; belgelere bak ve kararını ver.' : 'Yaptığın başvurular ve durumları. Ayrıntı için dokun.')}
    ${list.map(basvuruSatiri).join('') || `<div class="kart bos">${ev ? 'Henüz başvuru yok.' : 'Henüz başvuru yapmadın.'}</div>${ev ? '' : '<a class="btn tam buyukBtn" href="#/ilanlar">İlanlara göz at</a>'}`}`;
}
function ekranBasvuru(id) {
  const b = S.basvurular.find(x => x.id === id); if (!b) return bulunamadi();
  const i = S.ilanlar.find(x => x.id === b.ilanId);
  const slot = b.slotId ? S.slotlar.find(x => x.id === b.slotId) : null;
  const ev = S.rol === 'evsahibi';
  let h = `${geri('#/basvurular', 'Başvurular')}
    <h2 class="baslik">${esc(ev ? b.ad : (i ? i.baslik : 'Silinmiş ilan'))}</h2>
    <div class="soluk">${ev ? esc(i ? i.baslik : '') + ' · ' : ''}Başvuru: ${tarihYaz(b.olusturma)}</div><div class="cipler">${durumCip(b.durum)}</div>`;
  h += ipucu(ev ? 'Belgelere dokunarak aç. Kararını aşağıdaki düğmelerle ver; kiracıya bildirim gider.' : 'Başvurunun durumu ve görüşme bilgilerin burada.');

  if (slot) {
    h += `<div class="kart"><b class="kartBaslik">Görüşme</b><p style="font-size:20px;font-weight:700;margin:6px 0 0">${tarihSaat(slot.bas)}</p><p class="soluk" style="margin:2px 0 0">${slot.sure} dakika</p>
      <div class="btnlar"><button class="btn ikincil" onclick="randevuKopyala('${slot.id}')">Görüşme bilgisini kopyala</button></div></div>`;
  } else if (!ev && aktifMi(b)) {
    ksHazirla('bd-' + b.id, b.ilanId);
    h += `<div class="kart"><b class="kartBaslik">Görüşme saati seç</b>${kiraciSaatSecici()}
      ${KS.slot ? `<button class="btn tam buyukBtn" onclick="randevuAl('${b.id}')">Bu saati seç</button>` : ''}</div>`;
  } else {
    h += '<div class="kart"><b class="kartBaslik">Görüşme</b><p class="soluk" style="margin:6px 0 0">Görüşme saati yok.</p></div>';
  }

  if (!ev && slot && i) h += anahtarKart(i);

  if (ev) h += `<div class="kart"><b class="kartBaslik">İletişim</b><p style="font-size:20px;margin:6px 0 0;user-select:all">${esc(b.telefon) || '—'}</p>
    ${b.telefon ? `<div class="btnlar"><button class="btn ikincil" onclick="kopyala('${esc(b.telefon)}')">Numarayı kopyala</button><a class="btn ikincil" href="tel:${esc(b.telefon.replace(/\s/g, ''))}">Ara</a><a class="btn ikincil" target="_blank" rel="noopener" href="${esc(waLink(waNo(b.telefon), `Merhaba ${b.ad}, ${i ? i.baslik : ''} ilanına başvurunuzla ilgili yazıyorum.`))}">WhatsApp</a></div>` : ''}
    ${b.mesaj ? `<p class="aciklama soluk">“${esc(b.mesaj)}”</p>` : ''}</div>`;

  const bk = Object.entries(b.belgeler || {});
  h += `<div class="kart"><b class="kartBaslik">Belgeler</b>${bk.length ? `<div class="belgeler">${bk.map(([k, d]) => `<button class="belge" onclick="belgeAc('${d.id}'${ev ? `,'${esc(dosyaAdi(b.ad + ' - ' + (BELGE_TURLERI[k] || k))).replace(/'/g, '')}'` : ''})">${d.tur && d.tur.startsWith('image/') ? `<img data-dosya="${d.id}" alt="">` : '<span class="pdf">PDF</span>'}<span><b>${BELGE_TURLERI[k] || esc(k)}</b><small>Açmak için dokun · ${boyutYaz(d.boyut)}</small></span></button>`).join('')}</div>` : '<p class="soluk">Belge yok.</p>'}
    ${ev && bk.length ? `<button class="btn tam buyukBtn" id="pdfBtn" onclick="belgelerPdf('${b.id}')">${ik(IK.indir, 22)}Tüm belgeleri tek PDF yap · indir / paylaş</button>
      <p class="soluk kucukYazi">${CLAUDE_ICINDE ? "iPhone'daki Claude uygulamasında paylaşım menüsü açılır: WhatsApp, Mail veya Yazdır'ı seçebilirsin. Android'de ve bilgisayarda dosya kaydedilir; oradan paylaşabilir ya da yazdırabilirsin." : 'PDF hazır olunca "Paylaş"a dokun: WhatsApp, Mail ya da Yazdır\'ı seçebilirsin. İstersen telefona da indirebilirsin.'} Tek bir belge için belgeye dokun.</p>
      <p class="soluk kucukYazi">e-Devlet'ten alınan barkodlu belgeler, e-Devlet'teki "Barkodlu Belge Doğrulama" hizmetiyle doğrulanabilir.</p>` : ''}</div>`;

  if (ev) h += `<div class="kart"><b class="kartBaslik">Kararın</b><div class="btnlar">${[['inceleniyor', 'İnceliyorum'], ['onaylandi', 'Onayla'], ['reddedildi', 'Reddet']].map(([k, ad]) => `<button class="btn ${b.durum === k ? '' : 'ikincil'}" aria-pressed="${b.durum === k}" onclick="basvuruDurum('${b.id}','${k}')">${b.durum === k ? '✓ ' : ''}${ad}</button>`).join('')}</div>
    <label class="alan">Kendine not <span class="soluk" style="font-weight:400">(kiracı görmez)</span><textarea onchange="basvuruNot('${b.id}',this.value)" maxlength="1000">${esc(b.evSahibiNotu)}</textarea></label></div>`;

  const tehlikeler = [];
  if (slot && aktifMi(b)) tehlikeler.push(`<button class="btn tehlike" onclick="randevuIptal('${b.id}')">Görüşmeyi iptal et</button>`);
  if (ev && bk.length) tehlikeler.push(`<button class="btn tehlike" onclick="belgeleriSil('${b.id}')">Belgeleri cihazdan sil</button>`);
  if (!ev && aktifMi(b)) tehlikeler.push(`<button class="btn tehlike" onclick="basvuruGeriCek('${b.id}')">Başvuruyu geri çek</button>`);
  if (tehlikeler.length) h += tehlikeBolum(tehlikeler.join(''));
  return h;
}
function randevuKopyala(slotId) {
  const x = S.slotlar.find(s => s.id === slotId); if (!x) return;
  const i = S.ilanlar.find(a => a.id === x.ilanId), b = S.basvurular.find(a => a.id === x.basvuruId);
  kopyala([`Ev görüşmesi: ${i ? i.baslik : ''}`, `Zaman: ${tarihSaat(x.bas)} (${x.sure} dk)`, i ? `Adres: ${i.adres}` : '', b ? `Kiracı: ${b.ad} ${b.telefon || ''}` : ''].filter(Boolean).join('\n'));
}

/* ---------- Randevular (ev sahibi) ---------- */
function ekranRandevular() {
  const g = gunlereAyir(yaklasanRandevular());
  const gunler = Object.keys(g);
  return `<h2 class="baslik">Görüşmeler</h2>${ipucu('Kiracılarla yaklaşan görüşmelerin, gün gün. Kişiye dokununca başvurusu açılır.')}
    ${gunler.map(d => `<div class="kart"><div class="gunBaslik">${gunBaslik(d)}</div>${g[d].map(x => {
      const b = S.basvurular.find(a => a.id === x.basvuruId), i = S.ilanlar.find(a => a.id === x.ilanId);
      return `<div class="randevu"><div class="saatKutu">${saat(x.bas)}</div><div style="flex:1;min-width:0"><a href="#/basvuru/${x.basvuruId}" style="font-size:18px"><b>${esc(b ? b.ad : '—')}</b></a><div class="soluk kucukYazi">${esc(i ? i.baslik : '')} · ${x.sure} dk${b && b.telefon ? '<br>' + esc(b.telefon) : ''}</div></div></div>`;
    }).join('')}</div>`).join('') || '<div class="kart bos">Yaklaşan görüşme yok. İlanının sayfasından görüşme saati ekleyebilirsin.</div>'}`;
}

/* ---------- Bildirimler ---------- */
function ekranBildirimler() {
  const list = S.bildirimler.filter(b => b.rol === S.rol);
  return `<h2 class="baslik">Bildirimler</h2>${ipucu('Sana gelen haberler. Dokununca ilgili sayfa açılır.')}
    ${list.some(b => !b.okundu) ? '<button class="btn ikincil tam" onclick="tumunuOku()">Hepsini okundu say</button>' : ''}
    ${list.map(b => `<button class="bildirim ${b.okundu ? '' : 'yeni'}" onclick="bildirimAc('${b.id}')"><i></i><span>${esc(b.metin)}<small>${b.okundu ? '' : 'Yeni · '}${tarihYaz(b.tarih)}, ${new Date(b.tarih).toTimeString().slice(0, 5)}</small></span></button>`).join('') || '<div class="kart bos">Henüz bildirim yok.</div>'}`;
}
function bildirimAc(id) { const b = S.bildirimler.find(x => x.id === id); b.okundu = true; kaydet(); git(b.link || '#/'); }
function tumunuOku() { S.bildirimler.forEach(b => { if (b.rol === S.rol) b.okundu = true; }); kaydet(); render(); }

/* ---------- Ayarlar ---------- */
function ekranAyarlar() {
  const p = S.profil || {}, ks = Object.keys(S.oranlar).sort().reverse(), bu = ayAnahtar(new Date());
  return {
    html: `<h2 class="baslik">Ayarlar</h2>${ipucu('Uygulamayı nasıl kullandığını, bilgilerini ve verilerini buradan yönetirsin.')}
    <div class="kart"><b class="kartBaslik">Uygulamayı nasıl kullanıyorsun?</b>
      <button class="rolBtn ${S.rol === 'kiraci' ? 'secili' : ''}" aria-pressed="${S.rol === 'kiraci'}" onclick="rolSec('kiraci')"><b>${S.rol === 'kiraci' ? '✓ ' : ''}Kiracı olarak</b><span>Kiramı takip ediyorum, ev arıyorum.</span></button>
      <button class="rolBtn ${S.rol === 'evsahibi' ? 'secili' : ''}" aria-pressed="${S.rol === 'evsahibi'}" onclick="rolSec('evsahibi')"><b>${S.rol === 'evsahibi' ? '✓ ' : ''}Ev sahibi olarak</b><span>Evimi kiraya veriyorum.</span></button></div>
    <form class="kart" onsubmit="profilKaydet(event)"><b class="kartBaslik">Bilgilerim</b>
      <label class="alan" for="prAd">Adın soyadın<input id="prAd" name="ad" maxlength="60" value="${esc(p.ad)}"></label>
      <label class="alan" for="prTel">Telefonun<input id="prTel" name="telefon" type="tel" value="${esc(p.telefon)}"></label>
      <button class="btn tam">Kaydet</button></form>
    <div class="kart"><b class="kartBaslik">Yasal en fazla kira artışı</b>
      <p class="soluk kucukYazi" style="margin:4px 0 0">Konut kiralarında bir yılda yapılabilecek en fazla artış oranı (TÜFE'nin son 12 aylık ortalaması). Yenileme ayına bakılır.</p>
      ${S.oranlar[bu] == null ? `<p class="durum sari">${ayAdi(bu)}: Bu ayın oranı henüz açıklanmadı.</p>` : ''}
      <table class="tablo">${ks.map(k => `<tr><td>${ayAdi(k)}</td><td>%${fo(S.oranlar[k])}</td></tr>`).join('')}</table></div>
    ${yuklemeGoster() ? `<div class="kart"><b class="kartBaslik">Telefona yükle</b><p class="soluk kucukYazi" style="margin:4px 0 0">Ana ekranda simgesi olur, uygulama gibi açılır.</p><button class="btn tam" onclick="uygulamaYukle()">Uygulamayı yükle</button></div>` : ''}
    ${!CLAUDE_ICINDE && 'Notification' in window ? `<div class="kart"><b class="kartBaslik">Telefon bildirimleri</b><p class="soluk kucukYazi" style="margin:4px 0 0">Uygulama açıkken gelen haberler telefonun bildirimi olarak da görünür.</p><button class="btn ${Notification.permission === 'granted' ? 'ikincil' : ''} tam" onclick="bildirimIzni()" ${Notification.permission === 'granted' ? 'disabled' : ''}>${Notification.permission === 'granted' ? '✓ Açık' : 'Bildirimleri aç'}</button></div>` : ''}
    <div class="kart"><b class="kartBaslik">Yardım</b><p class="soluk kucukYazi" style="margin:4px 0 0">Uygulamanın kısa tanıtımını yeniden görebilirsin.</p>
      <button class="btn ikincil tam" onclick="tanitimTekrar()">Tanıtımı yeniden göster</button></div>
    <div class="kart"><b class="kartBaslik">Verilerim</b><p class="soluk kucukYazi" id="depolama" style="margin:4px 0 0">Veriler bu tarayıcıda saklanır; başka cihaza veya kişiye gitmez.</p></div>
    ${tehlikeBolum('<button class="btn tehlike" onclick="hepsiniSil()">Tüm verileri sil</button>')}`,
    after: async () => {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const e = await navigator.storage.estimate();
          const el = $('#depolama'); if (el) el.textContent = `Veriler bu tarayıcıda saklanır; başka cihaza veya kişiye gitmez. Kullanılan alan: ${boyutYaz(e.usage) || '0 KB'}.`;
        }
      } catch (e) {}
    }
  };
}
function profilKaydet(e) { e.preventDefault(); const f = new FormData(e.target); S.profil = { ad: f.get('ad').trim(), telefon: f.get('telefon').trim() }; kaydet(); toast('Bilgilerin kaydedildi'); }
async function hepsiniSil() {
  if (!(await onayla('Tüm evler, ödemeler, ilanlar, başvurular ve belgeler kalıcı olarak silinsin mi?', 'Evet, hepsini sil'))) return;
  try { const hepsi = await DB.hepsi(); for (const d of hepsi) await dosyaSil(d.id); } catch (e) {}
  try { localStorage.removeItem(DEPO_ANAHTARI); } catch (e) {}
  S = bosDurum(); S.tanitim = true; S.oranlar = Object.assign({}, ORANLAR_VARSAYILAN); kaydet();
  BF = {}; KS = {}; SF = { ilanId: null };
  toast('Tüm veriler silindi'); git('#/');
}

/* ---------- Yetim dosya temizliği ---------- */
async function yetimTemizle() {
  try {
    const kull = new Set();
    S.ilanlar.forEach(i => { (i.fotolar || []).forEach(f => kull.add(f)); ((i.anahtar && i.anahtar.fotolar) || []).forEach(f => kull.add(f.id)); });
    S.basvurular.forEach(b => Object.values(b.belgeler || {}).forEach(d => kull.add(d.id)));
    const hepsi = await DB.hepsi();
    for (const d of hepsi) if (!kull.has(d.id) && Date.now() - new Date(d.olusturma).getTime() > 86400000) await DB.sil(d.id);
  } catch (e) {}
}

/* ---------- Çizim ---------- */
const ROTALAR = {
  '': ekranAna, 'sozlesme-yeni': () => ekranSozlesmeForm(), 'sozlesme': ekranSozlesmeForm, 'odeme': ekranOdeme, 'mesaj': ekranMesaj,
  'ilanlar': ekranIlanlar, 'ilan': ekranIlan, 'ilan-form': ekranIlanForm, 'basvur': ekranBasvur, 'gonderildi': ekranGonderildi,
  'basvurular': ekranBasvurular, 'basvuru': ekranBasvuru, 'randevular': ekranRandevular,
  'bildirimler': ekranBildirimler, 'ayarlar': ekranAyarlar
};
const NAV_GRUP = { sozlesme: '', 'sozlesme-yeni': '', odeme: '', mesaj: '', ilan: 'ilanlar', 'ilan-form': 'ilanlar', basvur: 'ilanlar', basvuru: 'basvurular', gonderildi: 'basvurular' };
function ustCiz() {
  const n = S.bildirimler.filter(b => b.rol === S.rol && !b.okundu).length;
  $('#ust').innerHTML = `<a class="marka" href="#/">${LOGO}<span>Kira Defteri</span></a>${S.rol && S.tanitim
    ? `<a class="bildirimBtn" href="#/bildirimler" aria-label="Bildirimler${n ? ', ' + n + ' yeni' : ''}">${ik(IK.zil, 22)}<span>Bildirimler</span>${n ? `<em>${n > 9 ? '9+' : n}</em>` : ''}</a>` : ''}`;
}
function navCiz(r) {
  const aktif = r in NAV_GRUP ? NAV_GRUP[r] : r;
  const bek = S.basvurular.filter(b => b.durum === 'beklemede').length;
  const ogeler = S.rol === 'kiraci'
    ? [['', 'Ana sayfa', 'ev'], ['ilanlar', 'Ev bul', 'ara'], ['basvurular', 'Başvurularım', 'belge'], ['ayarlar', 'Ayarlar', 'ayar']]
    : [['', 'Ana sayfa', 'ev'], ['ilanlar', 'İlanlarım', 'anahtar'], ['basvurular', 'Başvurular', 'belge'], ['randevular', 'Görüşmeler', 'takvim'], ['ayarlar', 'Ayarlar', 'ayar']];
  $('#altNav').innerHTML = ogeler.map(([k, ad, ic]) => `<a href="#/${k}" class="${aktif === k ? 'aktif' : ''}" ${aktif === k ? 'aria-current="page"' : ''}>${ik(IK[ic])}${ad}${S.rol === 'evsahibi' && k === 'basvurular' && bek ? `<span class="rozet">${bek}</span>` : ''}</a>`).join('');
}
let SON_ROTA = null;
function render() {
  const h = ROTA;
  const [r, id] = h.split('/');
  ustCiz();
  const nav = $('#altNav'), app = $('#app');
  if (!S.tanitim) { nav.hidden = true; app.innerHTML = ekranTanitim() + yasal(); window.scrollTo(0, 0); return; }
  if (!S.rol) { nav.hidden = true; app.innerHTML = ekranRol() + yasal(); return; }
  nav.hidden = false;
  let out;
  try { out = (ROTALAR[r] || ekranAna)(id); }
  catch (e) { console.error(e); out = `<div class="kart">Bir sorun oluştu: ${esc(e.message)}</div><a class="btn ikincil tam" href="#/">Ana sayfaya dön</a>`; }
  if (typeof out === 'string') out = { html: out };
  app.innerHTML = out.html + yasal();
  navCiz(r || '');
  dosyalariBagla(app);
  if (out.after) out.after();
  if (SON_ROTA !== h) { window.scrollTo(0, 0); SON_ROTA = h; }
}

/* ---------- Uygulamayı telefona yükle (kendi sitesinde) ---------- */
let KURULUM = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); KURULUM = e; if (ROTA === '' || ROTA === 'ayarlar') render(); });
window.addEventListener('appinstalled', () => { KURULUM = null; toast('Kira Defteri yüklendi'); render(); });
const yuklemeGoster = () => !CLAUDE_ICINDE && !YUKLU();
async function uygulamaYukle() {
  if (KURULUM) { KURULUM.prompt(); try { await KURULUM.userChoice; } catch (e) {} KURULUM = null; render(); return; }
  const adimlar = IOS
    ? ['Bu sayfayı <b>Safari</b>\'de aç. WhatsApp veya Instagram içinden açtıysan sağ üstteki menüden "Safari\'de aç"ı seç.', 'Adres çubuğunun yanındaki <b>•••</b> düğmesine dokun.', '<b>Paylaş</b>\'a dokun.', 'Aşağı kaydır, <b>Ana Ekrana Ekle</b>\'ye dokun.', 'Sağ üstteki <b>Ekle</b>\'ye dokun.']
    : ['Bu sayfayı <b>Chrome</b>\'da aç.', 'Sağ üstteki <b>⋮</b> menüsüne dokun.', '<b>Uygulamayı yükle</b> ya da <b>Ana ekrana ekle</b>\'ye dokun.', '<b>Yükle</b>\'ye dokun.'];
  $('#modalIcerik').innerHTML = `<b style="font-size:20px">Telefona yükle</b><p class="soluk" style="margin:4px 0 8px">Yüklenince ana ekranda simgesi olur, uygulama gibi açılır.</p>
    <ol class="siradaki">${adimlar.map(a => `<li>${a}</li>`).join('')}</ol><button class="btn tam" onclick="modalKapat()">Tamam</button>`;
  $('#modal').hidden = false;
}
function yukleKarti() {
  if (!yuklemeGoster() || S.yukleGizle) return '';
  return `<div class="kart" style="background:var(--yesilA);border-color:#a9d3bb"><b class="kartBaslik">Telefonuna yükle</b><p style="margin:4px 0 0">Ana ekranda simgesi olur, uygulama gibi açılır.</p>
    <div class="btnlar"><button class="btn" onclick="uygulamaYukle()">Nasıl yüklenir?</button><button class="btn ikincil" onclick="S.yukleGizle=true;kaydet();render()">Şimdi değil</button></div></div>`;
}

/* ---------- Başlat ---------- */
S.oranlar = Object.assign({}, ORANLAR_VARSAYILAN, S.oranlar);
window.addEventListener('storage', e => { if (e.key === DEPO_ANAHTARI) { S = yukle(); render(); } });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
try { history.replaceState({ rota: '' }, ''); } catch (e) {}
if (!CLAUDE_ICINDE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
hatirlaticilar();
render();
oranlariYukle();
yetimTemizle();
setInterval(() => { hatirlaticilar(); ustCiz(); }, 5 * 60 * 1000);
